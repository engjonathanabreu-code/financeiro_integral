name: Adjust RH table once
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('public/financeiro.bundle.js')
          s=p.read_text(encoding='utf-8')
          old='''<div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>Nome</th><th>Vigência</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${people.map(p=>{const x=hrPayment(p,selectedHrMonth),done=x?.status==='Pago';return`<tr><td><button type=\"button\" class=\"linklike\" data-hr20-variable=\"${p.id}\"><b>${esc(p.name||'')}</b></button></td><td>${p.start?fmt(p.start):'—'} → ${p.end?fmt(p.end):'Indeterminado'}</td><td><b>${mny(hrValueForMonth(p,selectedHrMonth))}</b>${(()=>{const v=hrMonthlyVariable(p,selectedHrMonth),extra=Number(v?.overtime||0)+Number(v?.bonus||0);return extra?`<div class=\"muted\">Base ${mny(hrBaseValueForMonth(p,selectedHrMonth))} + variáveis ${mny(extra)}</div>`:''})()}</td><td>${done?badgeStatus('Pago'):(selectedHrMonth===start?'Pendente':'Previsto')}</td><td>${selectedHrMonth===start&&!done?`<button class=\"btn small\" data-hr20-pay=\"${p.id}\">Marcar pago</button>`:(done?'Quitado':'—')}</td></tr>`}).join('')||'<tr><td colspan=\"5\"><div class=\"empty\">Nenhum colaborador vigente neste mês.</div></td></tr>'}</tbody></table></div>'''
          new='''<div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>Nome</th><th>Valor base</th><th>Hora Extra</th><th>Bônus / Comissões</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${people.map(p=>{const x=hrPayment(p,selectedHrMonth),done=x?.status==='Pago',v=hrMonthlyVariable(p,selectedHrMonth),base=hrBaseValueForMonth(p,selectedHrMonth),overtime=Number(v?.overtime||0),bonus=Number(v?.bonus||0),total=base+overtime+bonus;return`<tr><td><button type=\"button\" class=\"linklike\" data-hr20-variable=\"${p.id}\"><b>${esc(p.name||'')}</b><small class=\"muted\" style=\"display:block\">Clique para editar variáveis</small></button></td><td><b>${mny(base)}</b></td><td>${overtime?`<b>${mny(overtime)}</b>`:'—'}</td><td>${bonus?`<b>${mny(bonus)}</b>`:'—'}</td><td><b>${mny(total)}</b></td><td>${done?badgeStatus('Pago'):(selectedHrMonth===start?'Pendente':'Previsto')}</td><td class=\"actions\"><button class=\"btn small ghost\" data-hr20-variable=\"${p.id}\">Editar variáveis</button>${selectedHrMonth===start&&!done?`<button class=\"btn small\" data-hr20-pay=\"${p.id}\">Marcar pago</button>`:(done?'<span class=\"muted\">Quitado</span>':'')}</td></tr>`}).join('')||'<tr><td colspan=\"7\"><div class=\"empty\">Nenhum colaborador vigente neste mês.</div></td></tr>'}</tbody></table></div>'''
          if old not in s:
              raise SystemExit('Tabela RH ativa não encontrada')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          d=Path('public/financeiro-dashboard-final-fix.js')
          x=d.read_text(encoding='utf-8')
          marker="  const trips=(d.trips||[]).filter(x=>!/finaliz|aprovad|conclu|encerrad/i.test(String(x.status||''))).slice(0,6);"
          insert="""  const trips=(d.trips||[]).filter(x=>!/finaliz|aprovad|conclu|encerrad/i.test(String(x.status||''))).slice(0,6);\n  const todayDate=new Date(today+'T12:00:00');\n  const limit60=new Date(todayDate);limit60.setDate(limit60.getDate()+60);\n  const contractDue=(d.hrPeople||[]).filter(p=>p.end&&new Date(p.end+'T12:00:00')>=todayDate&&new Date(p.end+'T12:00:00')<=limit60).sort((a,b)=>String(a.end).localeCompare(String(b.end)));"""
          if marker not in x:
              raise SystemExit('Ponto do dashboard não encontrado')
          x=x.replace(marker,insert,1)
          start="  c.innerHTML=`<div class=\"grid cols-4\"><div class=\"card metric\"><h3>Saldo atual do caixa</h3><b>${m(balance)}</b><small>movimentações registradas</small></div><div class=\"card metric\"><h3>Contas a vencer</h3><b>${m(openAccounts)}</b><small>${payments.length} lançamento(s) próximo(s)</small></div><div class=\"card metric\"><h3>Entradas previstas ERP</h3><b>${m(expected)}</b><small>${erp.length} parcela(s) próxima(s)</small></div><div class=\"card metric\"><h3>Documentos recentes</h3><b>${docs.length}</b><small>processados no Financeiro</small></div></div>"
          repl=start+"${contractDue.length?`<section class=\"card\" style=\"margin-top:16px\"><div class=\"section-head\"><div><h3>Contratos próximos do vencimento</h3><p class=\"muted\">Contratos que vencem nos próximos 60 dias.</p></div><span class=\"badge warn\">${contractDue.length}</span></div>${contractDue.map(p=>`<div class=\"mini-row readonly\"><span><b>${e(p.name||'Colaborador')}</b><small>Vencimento em ${f(p.end)}</small></span><strong>${Math.max(0,Math.ceil((new Date(p.end+'T12:00:00')-todayDate)/86400000))} dias</strong></div>`).join('')}</section>`:''}"
          if start not in x:
              raise SystemExit('Início do dashboard não encontrado')
          x=x.replace(start,repl,1)
          d.write_text(x,encoding='utf-8')

          i=Path('public/index.html')
          h=i.read_text(encoding='utf-8')
          h=re.sub(r'financeiro\.bundle\.js\?v=\d+','financeiro.bundle.js?v=6',h)
          h=re.sub(r'financeiro-dashboard-final-fix\.js\?v=\d+','financeiro-dashboard-final-fix.js?v=4',h)
          i.write_text(h,encoding='utf-8')
          PY
          node --check public/financeiro.bundle.js
          node --check public/financeiro-dashboard-final-fix.js
          rm -f .github/workflows/adjust-rh-table-once.yml
          rm -f .github/workflows/fix-active-ai-bills-once.yml
          git config user.name "Integral Financeiro Source"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: detalhar variaveis mensais do RH e alertar vencimentos" || true
          git push
