name: Fix AI account submit once
on:
  push:
    paths:
      - '.github/workflows/fix-ai-account-submit-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar botao de envio da IA em Contas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/financeiro.bundle.js')
          s=p.read_text()
          old='''<input id="v10AccountFiles" type="file" accept="image/*,.pdf" multiple required></div><div id="v10AccountAIStatus" class="notice">Você pode enviar várias contas de uma vez.</div></div><div class="modal-foot"><button class="btn">Analisar contas</button></div></form>'''
          new='''<input id="v10AccountFiles" type="file" accept="image/*,.pdf" multiple required><div style="margin-top:14px"><button class="btn" id="v10AccountAISubmit" type="submit" disabled>Enviar para análise da IA</button></div></div><div id="v10AccountAIStatus" class="notice">Selecione uma ou mais contas para habilitar o envio.</div></div></form>'''
          if old not in s:
              raise SystemExit('Trecho do modal de IA de Contas nao encontrado')
          s=s.replace(old,new,1)
          old2="x.querySelector('#v10AccountAI').onsubmit=async e=>{e.preventDefault();const files=[...x.querySelector('#v10AccountFiles').files],status=x.querySelector('#v10AccountAIStatus');"
          new2="const aiFiles=x.querySelector('#v10AccountFiles'),aiSubmit=x.querySelector('#v10AccountAISubmit'),aiStatus=x.querySelector('#v10AccountAIStatus');aiFiles.onchange=()=>{const n=aiFiles.files.length;aiSubmit.disabled=!n;aiStatus.textContent=n?n+' arquivo(s) selecionado(s). Clique em Enviar para análise da IA.':'Selecione uma ou mais contas para habilitar o envio.'};x.querySelector('#v10AccountAI').onsubmit=async e=>{e.preventDefault();const files=[...aiFiles.files],status=aiStatus;if(!files.length)return;aiSubmit.disabled=true;aiSubmit.textContent='Enviando para IA...';"
          if old2 not in s:
              raise SystemExit('Handler da IA de Contas nao encontrado')
          s=s.replace(old2,new2,1)
          old3="}catch(err){status.textContent=err.message}};}"
          new3="}catch(err){status.textContent=err.message;aiSubmit.disabled=false;aiSubmit.textContent='Enviar para análise da IA'}};}"
          # limitar substituicao ao primeiro trecho apos accountAIUpload
          pos=s.find('function accountAIUpload()')
          tail=s[pos:]
          if old3 not in tail:
              raise SystemExit('Tratamento de erro da IA de Contas nao encontrado')
          tail=tail.replace(old3,new3,1)
          s=s[:pos]+tail
          p.write_text(s)

          i=Path('public/index.html')
          t=i.read_text().replace('financeiro.bundle.js?v=2','financeiro.bundle.js?v=3')
          i.write_text(t)
          PY
          rm -f .github/workflows/fix-ai-account-submit-once.yml
          git config user.name 'Integral Financeiro Source Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: exibir envio para IA ao selecionar contas'
          git push