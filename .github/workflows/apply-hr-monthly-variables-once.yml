name: Apply RH monthly variables once
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/adjust-hr-monthly-variables.py
      - run: node --check public/financeiro.bundle.js
      - run: |
          git config user.name "Integral Financeiro Source"
          git config user.email "actions@users.noreply.github.com"
          git add public/financeiro.bundle.js public/index.html
          git commit -m "feat: variaveis mensais de RH por colaborador" || true
          git push
