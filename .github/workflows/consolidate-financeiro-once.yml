name: Consolidar Financeiro uma vez

on:
  push:
    paths:
      - '.github/workflows/consolidate-financeiro-once.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar bundles consolidados
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('public')

          js_files = [
            'app.js',
            'patch-v2.js',
            'patch-v3.js',
            'patch-v4.js',
            'patch-v5.js',
            'patch-v6.js',
            'patch-v6-sync.js',
            'patch-v7.js',
            'patch-v8.js',
            'patch-v9.js',
            'patch-v10-pre.js',
            'patch-v10.js',
            'patch-v11.js',
            'patch-v12.js',
            'patch-v13.js',
            'patch-v14.js',
            'patch-v16.js',
            'patch-v17.js',
            'patch-v18.js',
            'patch-v19.js',
            'patch-v20.js',
          ]

          css_files = [
            'styles.css',
            'patch-v2.css',
            'patch-v3.css',
            'patch-v4.css',
            'patch-v6.css',
            'patch-v9.css',
            'patch-v10.css',
            'patch-v11.css',
            'patch-v12.css',
            'patch-v13.css',
            'patch-v17.css',
          ]

          for name in js_files + css_files:
            if not (root / name).exists():
              raise SystemExit(f'Arquivo obrigatório ausente: {name}')

          js = [
            '/* Integral Financeiro - bundle consolidado. Fontes originais mantidas no repositório para histórico. */',
            "window.__INTEGRAL_FINANCEIRO_BUNDLE_VERSION__='2026.08.24-v1';",
          ]
          for name in js_files:
            js.append(f'\n/* ===== SOURCE: {name} ===== */\n')
            js.append((root / name).read_text(encoding='utf-8'))
            js.append('\n;\n')
          (root / 'financeiro.bundle.js').write_text(''.join(js), encoding='utf-8')

          css = ['/* Integral Financeiro - CSS consolidado */\n']
          for name in css_files:
            css.append(f'\n/* ===== SOURCE: {name} ===== */\n')
            css.append((root / name).read_text(encoding='utf-8'))
            css.append('\n')
          (root / 'financeiro.bundle.css').write_text(''.join(css), encoding='utf-8')

          index = '''<!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>Integral Financeiro</title>
            <link rel="stylesheet" href="financeiro.bundle.css?v=1">
          </head>
          <body>
            <canvas id="matrix"></canvas>
            <div id="app"></div>
            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
            <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
            <script src="supabase-config.js?v=21"></script>
            <script src="financeiro.bundle.js?v=1"></script>
          </body>
          </html>
          '''
          import textwrap
          (root / 'index.html').write_text(textwrap.dedent(index).strip() + '\n', encoding='utf-8')

          # Workflow de uso único: remove a si próprio depois de gerar os bundles.
          Path('.github/workflows/consolidate-financeiro-once.yml').unlink()
          PY

      - name: Verificação básica do bundle
        run: |
          test -s public/financeiro.bundle.js
          test -s public/financeiro.bundle.css
          grep -q 'patch-v20.js' public/financeiro.bundle.js
          grep -q 'financeiro.bundle.js' public/index.html
          ! grep -q 'patch-v19.js' public/index.html

      - name: Commit da consolidação
        run: |
          git config user.name "Integral Automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html public/financeiro.bundle.js public/financeiro.bundle.css .github/workflows/consolidate-financeiro-once.yml
          git commit -m "refactor: consolidar frontend financeiro em bundles únicos"
          git push
